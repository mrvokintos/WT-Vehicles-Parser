[package]
name = "wt-vehicles-parser"
version = "2.0.0"
edition = "2021"
description = "Builds vehicles.json for WT Tracker from War Thunder game files (names exactly as in the kill feed)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
wt_blk = "0.3.1"
serde_json = "1"
csv = "1"
regex = "1"
ureq = "2.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
strip = true
